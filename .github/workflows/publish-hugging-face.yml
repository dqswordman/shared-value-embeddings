name: Publish technical report to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-shared-value-embeddings-space
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'dqswordman/shared-value-embeddings'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the scientific release is public
        id: release
        shell: bash
        run: |
          if curl --silent --fail https://api.github.com/repos/dqswordman/shared-value-embeddings/releases/tags/v1.0.1 > "$RUNNER_TEMP/release.json"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        if: steps.release.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Install the Hub client
        if: steps.release.outputs.ready == 'true'
        run: python -m pip install "huggingface_hub==1.26.0"
      - name: Publish and verify the Space
        if: steps.release.outputs.ready == 'true'
        env:
          HF_OIDC_RESOURCE: spaces/DQSWORDMAN/shared-value-embeddings
        run: python scripts/publish_space.py "$RUNNER_TEMP/shared-value-embeddings-space" --publish
